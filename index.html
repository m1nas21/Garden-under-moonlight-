<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Garden Under Moonlight</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="garden">

        <div class="moonlight"></div>

        <div class="moon-haze"></div>

        <div class="stars" id="stars"></div>

        <div class="flower-garden" id="flowerGarden"></div>

        <div class="fireflies" id="fireflies"></div>

        <div class="ground"></div>

        <div class="grass-field" id="grassField"></div>

    </main>

    <script src="script.js"></script>

</body>

</html>
